context:
  version: "0.89.15"

package:
  name: open-knowledge
  version: ${{ version }}

source:
  - url: https://registry.npmjs.org/@inkeep/open-knowledge/-/open-knowledge-${{ version }}.tgz
    sha256: 5044cc7b9931656573f58c85f7f6ac14d22b8287b03ecacf50624a2f34851d5b
  # The npm tarball ships prebuilt native bindings only, build them from here.
  - url: https://github.com/inkeep/open-knowledge/archive/refs/tags/v${{ version }}.tar.gz
    sha256: e8d7a758edc6b7e80f4165529f3c250b70bb92e96ba47ee7ff58b87e8ffc64c0
    target_directory: repo
    patches:
      # Use conda-forge's Rust compiler instead of requiring upstream's exact patch release.
      - conda-rust-toolchain.patch

build:
  number: 0
  dynamic_linking:
    binary_relocation: false
  script:
    - if: win
      then:
        - call npm pack --ignore-scripts
        - call npm install --global --ignore-scripts --omit=optional --prefix "%PREFIX%\lib" inkeep-open-knowledge-${{ version }}.tgz
        - cd repo\packages\native-config
        - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
        - cargo build --release --locked
        - node "%RECIPE_DIR%\build.js"
      else:
        - npm pack --ignore-scripts
        - npm install --global --ignore-scripts --omit=optional inkeep-open-knowledge-${{ version }}.tgz
        - cd repo/packages/native-config
        - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
        - cargo build --release --locked
        - node "$RECIPE_DIR/build.js"

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
  host:
    - nodejs >=24
  run:
    - git
    - nodejs >=24
    - napi-rs-keyring ==2.1.2
    - parcel-watcher >=2.5.6,<3

tests:
  - files:
      recipe:
        - test.cjs
    script:
      - node test.cjs
      - ok --version
      - ok --help
      - ok config validate
      - open-knowledge --version

about:
  homepage: https://openknowledge.ai/
  summary: Beautiful, AI-native markdown editor and LLM wiki
  description: |
    OpenKnowledge is a local-first markdown editor for knowledge bases,
    LLM wikis, specifications, and notes. It includes a web UI, CLI, MCP
    server, agent skills, semantic search, and Git-based sharing.
  license: GPL-3.0-or-later
  license_file:
    - dist/LICENSE
    - dist/THIRD_PARTY_NOTICES.md
    - repo/packages/native-config/THIRDPARTY.yml
  documentation: https://openknowledge.ai/docs
  repository: https://github.com/inkeep/open-knowledge

extra:
  recipe-maintainers:
    - timkpaine
